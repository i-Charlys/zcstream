name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (Clang GPU)
            target: windows-x64
            os: windows-latest
            portable: "OFF"
          - name: Windows ARM64 (MSVC Portable)
            target: windows-arm64
            os: windows-11-arm
            portable: "ON"
          - name: Linux x64 (Portable)
            target: linux-x64
            os: ubuntu-24.04
            portable: "ON"
          - name: Linux ARM64 (Portable)
            target: linux-arm64
            os: ubuntu-24.04-arm
            portable: "ON"

    steps:
      - name: Checkout zcstream
        uses: actions/checkout@v4

      - name: Set up MSYS2 CLANG64 (Windows x64)
        if: matrix.target == 'windows-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - name: Configure, Build, Test & Stage (Windows x64 CLANG64)
        if: matrix.target == 'windows-x64'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DZCRUDP_PORTABLE_CODEC=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix dist

      - name: Configure, Build, Test & Stage (Windows ARM64 MSVC)
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DZCRUDP_PORTABLE_CODEC=${{ matrix.portable }}
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix dist

      - name: Install Linux X11 development headers
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev

      - name: Configure, Build, Test & Stage (Linux)
        if: startsWith(matrix.target, 'linux-')
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DZCRUDP_PORTABLE_CODEC=${{ matrix.portable }}
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix dist

      - name: Upload zcstream artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcstream-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
